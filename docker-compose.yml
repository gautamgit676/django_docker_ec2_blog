services:

  web:
    image: gautam147/djangoimagesbingo:latest
    container_name: django_blogs

    command: gunicorn --bind 0.0.0.0:8000 --workers 3 Djangoback.wsgi:application

    volumes:
      - static_volume:/app/staticfiles

    expose:
      - "8000"

    env_file:
      - .env

    depends_on:
      - redis

    restart: unless-stopped


  redis:
    image: redis:8
    container_name: django_redis

    restart: unless-stopped


  nginx:
    image: nginx:latest
    container_name: django_nginx

    ports:
      - "80:80"

    volumes:
      - static_volume:/app/staticfiles
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - web

    restart: unless-stopped


volumes:
  static_volume: