services:

  web:
    build: .
    container_name: django_blogs

    # command: gunicorn --bind 0.0.0.0:8000 Djangoback.wsgi:application
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 --reload Djangoback.wsgi:application
    
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media

    expose:
      - "8000"

    env_file:
      - .env

    depends_on:
      - db
      - redis


  db:
    image: postgres:17
    container_name: django_postgres

    environment:
      POSTGRES_DB: djangodb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"


  nginx:
    image: nginx:latest
    container_name: django_nginx

    ports:
      - "80:80"

    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - web


  redis:
    image: redis:8
    container_name: django_redis

    ports:
      - "6379:6379"


volumes:
  postgres_data:
  static_volume:
  media_volume: